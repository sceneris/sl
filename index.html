<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Latest Showcase</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 15px; }
        
        /* Navigation */
        nav { display: flex; justify-content: center; gap: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        nav a { color: #888; text-decoration: none; font-size: 1.1rem; }
        nav a.active { color: #fff; font-weight: bold; }

        /* Section Heading */
        .section-title { font-size: 1.4rem; margin-bottom: 20px; color: #eee; text-align: center; }

        /* Video Card Block */
        article { background: #1a1a1a; border-radius: 8px; padding: 15px; margin-bottom: 25px; }
        h2 { margin: 0 0 5px; font-size: 1.2rem; }
        p { margin: 0 0 12px; color: #aaa; font-size: 0.9rem; }

        /* 16:9 Responsive Video Box */
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Loading / Error States */
        .loading-text { text-align: center; color: #888; padding: 40px 0; font-size: 1.1rem; }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav>
        <a href="index.html" class="active">Recent</a>
        <a href="lindenhome.html">Linden Home</a>
        <a href="lindenhome.html">Mainland</a>
        <a href="landscapes.html">Estate</a>
    </nav>

    <h1 class="section-title">Latest Videos</h1>

    <!-- CONTAINER FOR DYNAMICALLY LOADED CARDS -->
    <main id="video-wrapper">
        <div class="loading-text">Loading latest videos...</div>
    </main>

    <!-- AUTOMATIC YOUTUBE RSS FEED SCRIPT -->
    <script>
        const channelId = 'UCx4iXLIKr4MPyHRMd5dXPbA'; 
        const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const wrapper = document.getElementById('video-wrapper');
                wrapper.innerHTML = ''; // Clear loading text

                // Take the top 3 latest videos
                const latestVideos = data.items.slice(0, 3);

                latestVideos.forEach(item => {
                    // Get Video ID (handles query string parameters cleanly)
                    const videoId = item.link.split('v=')[1].split('&')[0];

                    // Create Article Card Wrapper
                    const card = document.createElement('article');

                    // Set Title
                    const title = document.createElement('h2');
                    title.textContent = item.title;
                    card.appendChild(title);

                    // Set Date/Sub-info
                    const meta = document.createElement('p');
                    const pubDate = new Date(item.pubDate).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                    meta.textContent = `Published on ${pubDate}`;
                    card.appendChild(meta);

                    // Create 16:9 Video Box
                    const videoBox = document.createElement('div');
                    videoBox.className = 'video-box';

                    const iframe = document.createElement('iframe');
                    iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}`;
                    iframe.allowFullscreen = true;

                    videoBox.appendChild(iframe);
                    card.appendChild(videoBox);

                    wrapper.appendChild(card);
                });
            })
            .catch(error => {
                document.getElementById('video-wrapper').innerHTML = '<div class="loading-text">Failed to load latest videos.</div>';
                console.error('Error fetching YouTube RSS:', error);
            });
    </script>

</body>
</html>
