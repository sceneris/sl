<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent</title>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            font-family: sans-serif; 
            max-width: 100%; /* Matches Linden Home full screen width */
            margin: 0 auto; 
            padding: 20px; 
        }
        
        /* Navigation */
        nav { 
            display: flex; 
            justify-content: flex-start; 
            gap: 20px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
        }
        nav a { color: #888; text-decoration: none; font-size: 1.1rem; }
        nav a:hover, nav a.active { color: #fff; font-weight: bold; }
        
        /* Responsive Grid (Matches Linden Home layout) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
            gap: 20px;
        }
        
        /* Video Card Block */
        article { background: #1a1a1a; border-radius: 8px; padding: 15px; }
        h2 { margin: 0 0 10px; font-size: 1.2rem; }
        
        /* 16:9 Responsive Video Box */
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav>
        <a href="index.html" class="active">Recent</a>
        <a href="lindenhome.html">Linden Home</a>
        <a href="mainland.html">Mainland</a>
        <a href="estate.html">Estate</a>
        <a href="events.html">Events</a>
    </nav>

    <!-- STATIC VIDEO CARDS CONTAINER -->
    <main class="video-grid">

        <!-- Card 1 (Latest Upload) -->
        <article>
            <h2>2026 09 27</h2>
            <div class="video-box">
                <iframe src="https://www.youtube.com/embed/ER5Zqst6pq4" allowfullscreen></iframe>
            </div>
        </article>

        <!-- Card 2 -->
        <article>
            <h2>2026 09 19</h2>
            <div class="video-box">
                <iframe src="https://www.youtube.com/embed/M9OQI17dZgE" allowfullscreen></iframe>
            </div>
        </article>

        <!-- Card 3 -->
        <article>
            <h2>2026 09 13</h2>
            <div class="video-box">
                <iframe src="https://www.youtube.com/embed/9NnC26x9BQ8" allowfullscreen></iframe>
            </div>
        </article>

        <!-- Card 4 -->
        <article>
            <h2>2026 09 05</h2>
            <div class="video-box">
                <iframe src="https://www.youtube.com/embed/k4GTpF8rDZg" allowfullscreen></iframe>
            </div>
        </article>

    </main>

</body>
</html>
