<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent</title>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            font-family: sans-serif; 
            max-width: 100%; /* Matches Linden Home full screen width */
            margin: 0 auto; 
            padding: 20px; 
        }
        
        /* Navigation */
        nav { 
            display: flex; 
            justify-content: flex-start; 
            gap: 20px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
        }
        nav a { color: #888; text-decoration: none; font-size: 1.1rem; }
        nav a:hover, nav a.active { color: #fff; font-weight: bold; }
        
        /* Responsive Grid (Matches Linden Home layout) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
            gap: 20px;
        }
        
        /* Video Card Block */
        article { background: #1a1a1a; border-radius: 8px; padding: 15px; }
        h2 { margin: 0 0 10px; font-size: 1.2rem; }
        
        /* 16:9 Responsive Video Box */
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .loading-text { color: #888; padding: 20px 0; }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav>
        <a href="index.html" class="active">Recent</a>
        <a href="lindenhome.html">Linden Home</a>
        <a href="mainland.html">Mainland</a>
        <a href="estate.html">Estate</a>
        <a href="events.html">Events</a>
    </nav>

    <!-- CONTAINER FOR DYNAMICALLY LOADED CARDS -->
    <main id="video-wrapper" class="video-grid">
        <div class="loading-text">Loading latest videos...</div>
    </main>

    <!-- AUTOMATIC YOUTUBE RSS FEED SCRIPT -->
<script>
    const channelId = 'UCx4iXLIKr4MPyHRMd5dXPbA';
    const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;

    // Primary and Fallback API URLs
    const primaryApi = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
    const fallbackApi = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;

    function renderVideos(items) {
        const wrapper = document.getElementById('video-wrapper');
        wrapper.innerHTML = ''; // Clear loading text

        const latestVideos = items.slice(0, 4);

        latestVideos.forEach(item => {
            // Extract Video ID safely from link or id
            let videoId = '';
            if (item.link) {
                videoId = item.link.includes('v=') ? item.link.split('v=')[1].split('&')[0] : item.link.split('/').pop();
            } else if (item.guid) {
                videoId = item.guid.replace('yt:video:', '');
            }

            const card = document.createElement('article');

            // Title
            const title = document.createElement('h2');
            title.textContent = item.title;
            card.appendChild(title);

            // Video Embed Box
            const videoBox = document.createElement('div');
            videoBox.className = 'video-box';

            const iframe = document.createElement('iframe');
            iframe.src = `https://www.youtube.com/embed/${videoId}`;
            iframe.allowFullscreen = true;

            videoBox.appendChild(iframe);
            card.appendChild(videoBox);

            wrapper.appendChild(card);
        });
    }

    // Try primary API (rss2json)
    fetch(primaryApi)
        .then(res => {
            if (!res.ok) throw new Error('Primary API HTTP error');
            return res.json();
        })
        .then(data => {
            if (data.status === 'ok' && data.items.length > 0) {
                renderVideos(data.items);
            } else {
                throw new Error('Primary API returned invalid data');
            }
        })
        .catch(err => {
            console.warn('rss2json failed, attempting fallback proxy...', err);
            
            // Fallback: Fetch raw RSS via AllOrigins proxy and parse XML natively
            fetch(fallbackApi)
                .then(res => res.json())
                .then(data => {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                    const entries = Array.from(xmlDoc.querySelectorAll("entry"));

                    if (entries.length === 0) throw new Error("No feed entries found");

                    const items = entries.map(entry => ({
                        title: entry.querySelector("title").textContent,
                        link: entry.querySelector("link").getAttribute("href"),
                        guid: entry.querySelector("id").textContent
                    }));

                    renderVideos(items);
                })
                .catch(fallbackErr => {
                    console.error("Both primary and fallback feeds failed:", fallbackErr);
                    document.getElementById('video-wrapper').innerHTML = '<div class="loading-text">Failed to load latest videos. Please try refreshing.</div>';
                });
        });
</script>

</body>
</html>
