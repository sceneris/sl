<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linden Home</title>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            font-family: sans-serif; 
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 30px 20px; 
        }

        /* Two-Column Layout Container */
        .layout-wrapper {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        /* Left Column Navigation */
        nav { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            min-width: 140px; 
            position: sticky;
            top: 30px;
        }
        nav a { 
            color: #888; 
            text-decoration: none; 
            font-size: 1.1rem; 
            transition: color 0.2s;
        }
        nav a:hover, nav a.active { 
            color: #fff; 
            font-weight: bold; 
        }

        /* Right Column Content Area */
        main {
            flex: 1;
        }

        /* Video Card Block */
        article { 
            background: #1a1a1a; 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 25px; 
        }
        h2 { margin: 0 0 5px; font-size: 1.2rem; }
        p { margin: 0 0 12px; color: #aaa; font-size: 0.9rem; }

        /* 16:9 Responsive Video Box */
        .video-box { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            border-radius: 6px; 
        }
        .video-box iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }

        @media (max-width: 650px) {
            /* Stack navigation on top, content on bottom */
            .layout-wrapper {
                flex-direction: column;
                gap: 20px;
            }
        
            /* Clean horizontal top menu */
            nav {
                flex-direction: row;
                justify-content: left;
                gap: 15px; /* Comfortable touch spacing for mobile fingers */
                width: 100%;
                border-bottom: 1px solid #333;
                padding-bottom: 15px;
                position: static; /* Unsticks nav so it scrolls naturally with page */
            }
        
            /* Ensures video main container expands full width */
            main {
                width: 100%;
            }
        }

    </style>
</head>
<body>

    <div class="layout-wrapper">
        <!-- LEFT COLUMN: NAVIGATION -->
        <nav>
            <a href="index.html">Home</a>
            <a href="lindenhome.html" class="active">Linden Home</a>
            <a href="landscapes.html">Estate</a>
        </nav>

        <!-- RIGHT COLUMN: VIDEOS -->
        <main>
            <article>
                <h2>Traditional</h2>
                <div class="video-box">
                    <iframe src="https://www.youtube.com/embed/SStJDtXXHuA" allowfullscreen></iframe>
                </div>
            </article>

            <article>
                <h2>Camper</h2>
                <div class="video-box">
                    <iframe src="https://www.youtube.com/embed/k4GTpF8rDZg" allowfullscreen></iframe>
                </div>
            </article>
        </main>
    </div>

</body>
</html>
